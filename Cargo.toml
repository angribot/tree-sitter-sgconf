[package]
name = "tree-sitter-sgconf"
description = "Tree-sitter grammar for Surge configuration documents"
version = "0.1.0"
authors = ["Civi"]
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "sgconf"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/angribot/tree-sitter-sgconf"
readme = "README.md"
edition = "2021"
rust-version = "1.77"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "docs/adr/*",
  "docs/compatibility.md",
  "grammar.js",
  "queries/*",
  "scripts/check-surge-compatibility.sh",
  "src/*",
  "test/fixtures/compatibility/**",
  "tests/*",
  "tree-sitter.json",
  "/LICENSE",
  "/README.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
